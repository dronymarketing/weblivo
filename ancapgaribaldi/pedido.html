<noscript><p class="sinjs">La tienda necesita JavaScript para mostrar los productos. Podés llamarnos al <a href="tel:+59822034196">2203 4196</a>: estamos abiertos las 24 horas.</p></noscript>

<main class="cont pag pag--angosta">
  <form class="seguir" id="form-seguir" novalidate>
    <h1 class="pag__t">Seguí tu pedido</h1>
    <p>Escribí el número que te dimos al confirmar y el celular con el que lo hiciste.</p>
    <label class="campo"><span>Número de pedido</span><input name="num" inputmode="numeric" placeholder="1001" required></label>
    <label class="campo"><span>Celular</span><input name="tel" type="tel" inputmode="tel" placeholder="099 123 456" required></label>
    <p class="aviso-caja aviso-caja--error" id="seg-error" role="alert" hidden></p>
    <button class="btn btn--ancho" type="submit">Ver mi pedido</button>
  </form>
  <section class="seg" id="seguimiento" aria-live="polite" hidden></section>
</main>
